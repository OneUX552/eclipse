name: Build ESP32 Firmware

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: 'recursive'

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    - name: Install ESP-IDF dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-setuptools cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

    - name: Install ESP-IDF v4.1
      run: |
        git clone --recursive https://github.com/espressif/esp-idf.git
        cd esp-idf
        git checkout release/v4.1
        git submodule update --init --recursive
        ./install.sh

    - name: Set up environment
      run: |
        echo "$(pwd)/esp-idf/tools" >> $GITHUB_PATH
        echo "IDF_PATH=$(pwd)/esp-idf" >> $GITHUB_ENV

    - name: Build firmware
      run: |
        source esp-idf/export.sh
        cd $GITHUB_WORKSPACE
        idf.py build

    - name: Collect binaries
      run: |
        mkdir firmware-binaries
        cp build/bootloader/bootloader.bin firmware-binaries/
        cp build/partition_table/partition-table.bin firmware-binaries/
        cp build/ota_data_initial.bin firmware-binaries/
        cp build/hydra32.bin firmware-binaries/
        cp build/hydra32.elf firmware-binaries/
        cp build/flash_args firmware-binaries/
        cp sdkconfig firmware-binaries/

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v3
      with:
        name: firmware-binaries
        path: firmware-binaries/
