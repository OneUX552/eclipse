name: Build Hydra32 ESP32 Firmware

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-setuptools cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Set up ESP-IDF 4.1
        run: |
          mkdir -p ~/esp
          cd ~/esp
          git clone --branch v4.1 --depth 1 https://github.com/espressif/esp-idf.git
          cd esp-idf
          ./install.sh
          echo ". $HOME/esp/esp-idf/export.sh" >> $GITHUB_ENV

      - name: Export ESP-IDF environment
        run: |
          source $HOME/esp/esp-idf/export.sh
        shell: bash

      - name: Build firmware
        run: |
          source $HOME/esp/esp-idf/export.sh
          idf.py set-target esp32
          idf.py build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hydra32-firmware
          path: build/*.bin
