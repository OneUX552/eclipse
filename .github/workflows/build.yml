name: Build Hydra32 ESP32 Firmware

on:
  workflow_dispatch:   # run manually from Actions tab
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-setuptools cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Cache ESP-IDF
        uses: actions/cache@v4
        with:
          path: ~/esp/esp-idf
          key: esp-idf-v4.1

      - name: Set up ESP-IDF 4.1
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/esp
          cd ~/esp
          git clone --branch v4.1 --depth 1 https://github.com/espressif/esp-idf.git
          cd esp-idf
          ./install.sh

      - name: Build firmware
        run: |
          cd ~/esp/esp-idf
          . ./export.sh
          cd $GITHUB_WORKSPACE
          idf.py set-target esp32
          idf.py build

      - name: Prepare flash-ready files
        run: |
          mkdir flash-ready
          cp build/bootloader/bootloader.bin flash-ready/
          cp build/partition_table/partition-table.bin flash-ready/
          cp build/*.bin flash-ready/ || true
          cp build/*.elf flash-ready/ || true
          cd flash-ready
          zip -r ../hydra32_firmware.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hydra32-firmware
          path: hydra32_firmware.zip
